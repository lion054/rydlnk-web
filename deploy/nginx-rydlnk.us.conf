# rydlnk.us — Next.js 15 (standalone) behind nginx
#
# Deployed by rydlnk/scripts/deploy-to-server.sh. The app runs under pm2 as
# `rydlnk` on 127.0.0.1:3002; nothing but nginx can reach it.
#
# TLS issued 2026-07-30, expires 2026-10-28. Everything tagged
# "# managed by Certbot" below was written by:
#   sudo certbot --nginx -d rydlnk.us -d www.rydlnk.us --redirect
#
# Do not hand-edit those lines — certbot rewrites them on renewal. This file is
# a committed copy of what is running; the server is the source of truth.
#
# Note the vhost was HTTP-only until the certificate existed, on purpose: a
# `listen 443 ssl` block pointing at a missing cert fails `nginx -t`, and that
# blocks every reload on this box — all six other sites included.

server {
    server_name rydlnk.us www.rydlnk.us;

    access_log /var/log/nginx/rydlnk.us.access.log;
    error_log  /var/log/nginx/rydlnk.us.error.log;

    # Let certbot answer the HTTP-01 challenge without touching the proxy pass.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    client_max_body_size 10M;

    # Immutable build assets. Served by nginx rather than Node: standalone
    # excludes .next/static on the assumption a CDN fronts it, and every one of
    # these is content-hashed, so the far-future expiry is safe.
    location /_next/static/ {
        alias /var/www/rydlnk.us/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Files from public/. Short expiry — these keep their names across builds,
    # so a long one would pin a stale favicon or og image.
    location /_static/ {
        alias /var/www/rydlnk.us/public/;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location = /favicon.ico { alias /var/www/rydlnk.us/public/favicon.ico; access_log off; expires 7d; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:3002; }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # $host not $server_name: Next reads the forwarded host to build absolute
        # URLs, and $server_name would collapse www.rydlnk.us onto the first name
        # in the server_name list.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # No Upgrade/Connection pair here on purpose. The usual recipe needs a
        # `map $http_upgrade $connection_upgrade` in the http block, and this
        # box has none defined — referencing the variable would fail `nginx -t`
        # and block reloads for all six other sites on the server. A production
        # standalone build serves no WebSocket traffic (HMR is dev-only), so
        # there is nothing to upgrade. Add the map to conf.d first if that
        # changes.

        # Server Components stream their response. Buffering would hold the whole
        # document and throw away the streaming benefit.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rydlnk.us/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rydlnk.us/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.rydlnk.us) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = rydlnk.us) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name rydlnk.us www.rydlnk.us;
    return 404; # managed by Certbot




}